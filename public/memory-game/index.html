<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memory Game - Home</title><script src="https://cdn.tailwindcss.com"></script>
<style>
.cyber-title{text-shadow:0 0 8px #00eaff,0 0 16px #00eaff,0 0 32px #00eaff;animation:neonPulse 2.5s infinite}
@keyframes neonPulse{0%,100%{text-shadow:0 0 10px #00eaff}50%{text-shadow:0 0 25px #8a2be2}}
.btn-neon{border:2px solid rgba(255,255,255,.2);backdrop-filter:blur(6px);transition:all .3s ease}
.btn-neon:hover{box-shadow:0 0 20px #00eaff,0 0 40px #8a2be2;transform:translateY(-3px)}
.particle{position:absolute;border-radius:50%;background:rgba(255,255,255,.2);animation:floatUp 8s linear infinite}
@keyframes floatUp{0%{transform:translateY(0);opacity:0}10%,90%{opacity:1}100%{transform:translateY(-120vh);opacity:0}}
.glass-card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(12px)}
</style></head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center relative overflow-hidden">
<script>
const SETTINGS=JSON.parse(localStorage.getItem("settings"))||{masterVol:70,musicVol:60,sfxVol:60,darkMode:true,vibration:true};
document.documentElement.classList.toggle('dark',SETTINGS.darkMode);
const MASTER_VOL=SETTINGS.masterVol,MUSIC_VOL=SETTINGS.musicVol,SFX_VOL=SETTINGS.sfxVol,VIBRATION_ENABLED=SETTINGS.vibration,DARK_MODE=SETTINGS.darkMode;
const AudioContext=window.AudioContext||window.webkitAudioContext;const audioCtx=new AudioContext();let muted=false;
document.addEventListener('click',()=>{if(audioCtx.state==='suspended')audioCtx.resume()},{once:true});
function playTone(freq,type='sine',time=.12,vol=.08){if(muted)return;vol*=MASTER_VOL/100;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+time);o.stop(audioCtx.currentTime+time+.02)}
function vibrate(ms){if(VIBRATION_ENABLED&&navigator.vibrate)navigator.vibrate(ms)}
function createParticles(){for(let i=0;i<40;i++){const p=document.createElement("div");p.classList.add("particle");const size=Math.random()*6+2;p.style.width=size+"px";p.style.height=size+"px";p.style.left=Math.random()*100+"vw";p.style.top=Math.random()*100+"vh";p.style.animationDuration=Math.random()*5+5+"s";document.body.appendChild(p)}}createParticles();
</script>
<div class="glass-card p-8 rounded-3xl shadow-2xl w-full max-w-md text-center relative z-20">
<h1 class="text-4xl font-extrabold cyber-title mb-4">MEMORY GAME</h1>
<p class="text-white/70 mb-8 text-sm tracking-wide">Train your brain. Level up your memory.</p>
<div class="flex flex-col gap-4">
<button onclick="startGame()" class="bg-gradient-to-r from-cyan-400 to-purple-500 py-2 px-5 rounded-full text-base font-medium shadow-lg shadow-cyan-500/30 hover:scale-105 transition w-max mx-auto">▶ Start Game</button>
<button onclick="goToLevels()" class="bg-white/10 backdrop-blur-lg border border-white/20 py-2 px-5 rounded-full text-base shadow-md hover:bg-white/20 transition w-max mx-auto">🔓 Level Select</button>
<button onclick="goToSettings()" class="bg-white/5 backdrop-blur-xl border border-white/10 py-2 px-5 rounded-full text-base hover:bg-white/10 transition w-max mx-auto">⚙ Settings</button>
</div>
<p class="text-xs text-white/40 mt-8 tracking-wider">© 2025 Memory Game — Designed by <span class="text-cyan-300 font-medium">Girish Panda</span> — UI/UX Designer & Frontend Developer</p>
</div>
<script>
if(!localStorage.getItem("unlockedLevel"))localStorage.setItem("unlockedLevel","1");
function startGame(){playTone(880,'sine',.1);vibrate(20);window.location.href="levels.html"}
function goToLevels(){playTone(880,'sine',.1);vibrate(20);window.location.href="levels.html"}
function goToSettings(){playTone(880,'sine',.1);vibrate(20);window.location.href="settings.html"}
</script></body></html>
